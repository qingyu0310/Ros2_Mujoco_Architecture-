# 发射（摩擦轮）参数（ros2 run project shooter）。节点自己在 install 里找这个文件，不用带 --params-file
# 改完要 colcon build --packages-select project 才同步到 install
# 段名 /shooter 必须跟节点名对上，否则参数全落到默认值
# 实现以 ros2_layer/node/shooter/shooter.hpp 为准

/shooter:
  ros__parameters:
    control_period_s: 0.001
    # 输出轴角速度，左正右负；固定云台单发测试枪口速度约 20.7 m/s。
    # 按住左键预热至稳定后装填；当前电机模型未包含真实转速/功率上限。
    target_speed_rad_s: 1650.0
    speed_kp: 0.02
    speed_ki: 0.1
    torque_limit: 3.0  # 与模型 M3508 P19 力矩范围一致
    input_state_timeout_s: 0.2
    keyboard_topic: "/keyboard"
    joint_states_topic: "/joint_states"
    motor_topic_prefix: "/motor"
    left_joint: "pitch_barrel_friction_wheel_l_joint"
    right_joint: "pitch_barrel_friction_wheel_r_joint"
